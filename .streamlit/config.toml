[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
# Never show Python tracebacks to users; the app shows plain-English messages instead.
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50
